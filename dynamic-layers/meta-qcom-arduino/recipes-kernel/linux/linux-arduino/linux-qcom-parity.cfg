# Options linux-qcom 6.18 has and Arduino's defconfig does not
# GPIO character device uAPI v1: App Lab's OpenOCD (linuxgpiod) flashes the MCU with it
CONFIG_GPIO_CDEV_V1=y
# Compressed firmware files, as on 6.18
CONFIG_FW_LOADER_COMPRESS=y
CONFIG_FW_LOADER_COMPRESS_XZ=y
CONFIG_FW_LOADER_COMPRESS_ZSTD=y
